<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    {% include seo.html %}
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    {% if page.url contains '/usneseni/' or page.url contains '/rozpoctova-opatreni/' %}
    <link rel="stylesheet" href="{{ '/assets/css/usneseni.css' | relative_url }}">
    {% endif %}
    <link rel="icon" type="image/png" sizes="512x512" href="{{ '/assets/img/favicon.png' | relative_url }}">
    <link rel="apple-touch-icon" href="{{ '/assets/img/favicon.png' | relative_url }}">

</head>
<body>

<header class="site-header">
    <a href="{{ '/' | relative_url }}" class="logo">
        <img src="{{ '/assets/img/logo_cele.svg' | relative_url }}" alt="Litovle.cz – nezávislá občanská iniciativa">
    </a>

    <nav class="site-nav" aria-label="Hlavní navigace">
        <a href="{{ '/' | relative_url }}">Úvod</a>
        <a href="{{ '/zastupitelstvo/' | relative_url }}">Zastupitelstvo</a>
        <a href="{{ '/usneseni/' | relative_url }}">Usnesení</a>
        <a href="https://svoz.litovle.cz">Svoz odpadu</a>
        <a href="{{ '/o-projektu/' | relative_url }}">O projektu</a>
    </nav>
</header>

<main class="content{% if page.url contains '/usneseni/archiv/' %} usn-section{% endif %}">
    {{ content }}
</main>

<button type="button" id="site-back-to-top" class="site-back-to-top" aria-label="Zpět nahoru">↑ Nahoru</button>

<footer class="site-footer">
    © 2026 Litovle.cz · nezávislá občanská iniciativa<br>
    Vytvořil a spravuje Honza Kašík · <a href="https://honzakasik.cz" target="_blank" rel="noopener">honzakasik.cz</a>
</footer>

<!-- 100% privacy-first analytics -->
<script async src="https://scripts.simpleanalyticscdn.com/latest.js"></script>

<script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>

</body>
</html>
